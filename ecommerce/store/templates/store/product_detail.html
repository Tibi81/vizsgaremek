{% extends "store/main.html" %}
{% load static %}
{% load markdown_extras %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="product-img col-12 col-md-6">
            <img src="{{ product.imageURL }}" alt="{{ product.name }}" class="thumbnail">
        </div>
        <div class="product-description col-12 col-md-6">
            <h6 class="product-name"><strong>{{ product.name }}</strong></h6>
            <br>
            <h4>Ár: {{ product.price|floatformat:0 }} Ft</h4>
            <hr>
            <div>
                <p>{{ product.description|markdown|safe }}</p>
            </div>
            <div style="margin-top: 20px; display: flex; align-items: center;">
                <input type="number" min="1" value="1" id="quantity-{{ product.id }}" class="custom-quantity-input" style="width: 60px;">
                <button data-product="{{ product.id }}" data-action="add" class="btn btn-outline-secondary add-btn update-cart">
                    Kosárba
                </button>
                <hr>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
